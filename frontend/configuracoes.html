<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDV - Configurações</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .cfg-wrap { padding: 18px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 18px; }
    .cfg-actions { display:flex; gap:8px; flex-wrap: wrap; }
    .printer-grid { display:grid; grid-template-columns: 1fr 120px; gap:8px; }

    .users-topbar { display:flex; gap:8px; margin-bottom:10px; }
    .users-topbar input { flex:1; }

    .users-list { display:flex; flex-direction:column; gap:10px; max-height:500px; overflow:auto; }

    .user-item {
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .user-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .user-title { font-size:14px; font-weight:700; color:#0f172a; }
    .user-meta { font-size:12px; color:#64748b; margin-top:2px; }
    .user-pill {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: #e2e8f0;
      color: #334155;
    }

    .user-pill.dev { background:#fee2e2; color:#991b1b; }
    .user-pill.gerente { background:#dbeafe; color:#1e40af; }
    .user-pill.funcionario { background:#dcfce7; color:#166534; }

    .user-row-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
    .user-editor { margin-top:10px; padding-top:10px; border-top:1px dashed #dbe3ef; display:none; }
    .user-editor input, .user-editor select { margin-bottom:6px; }

    .empty { font-size:13px; color:#64748b; text-align:center; padding:14px; }

    @media (max-width: 980px) {
      .cfg-wrap { grid-template-columns: 1fr; }
      .printer-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="app-page">
  <header class="app-topbar">
    <div class="topbar-left">
      <div class="topbar-logo">PDV</div>
      <div class="topbar-brand">
        <div class="name" id="topRestaurantName">Restaurante</div>
        <div class="meta" id="topRestaurantMeta">Tenant</div>
      </div>
      <span id="conexao" class="status online">● Online</span>
    </div>
    <nav class="topbar-center">
      <span class="topbar-link active">Configurações</span>
    </nav>
    <div class="topbar-right">
      <div class="topbar-user-wrap">
        <button id="topUserTrigger" class="topbar-user-trigger" type="button">
          <div class="topbar-user">
            <div class="user-avatar" id="topUserAvatar">US</div>
            <div>
              <div class="user-name" id="topUserName">Usuário</div>
              <div class="meta" id="topUserRole"></div>
            </div>
          </div>
        </button>
        <div id="topUserMenu" class="user-menu hidden"></div>
      </div>
    </div>
  </header>

  <main class="cfg-wrap">
    <section class="card">
      <h2>Configurações do Restaurante</h2>
      <div class="form-group">
        <label for="cfgNome">Nome do estabelecimento</label>
        <input id="cfgNome" type="text" placeholder="Nome do restaurante">
      </div>
      <div class="form-group">
        <label for="cfgModo">Modo de operação</label>
        <select id="cfgModo">
          <option value="bar">Bar</option>
          <option value="fastfood">Fast Food</option>
          <option value="hibrido">Híbrido</option>
        </select>
      </div>
      <div class="form-group">
        <label for="cfgCor">Cor de destaque</label>
        <input id="cfgCor" type="color" value="#1d4ed8">
      </div>
      <div class="cfg-actions">
        <button id="btnSalvarCfg" class="btn btn-primary">Salvar configurações</button>
        <button id="btnVoltarPainel" class="btn btn-secondary">Voltar ao painel</button>
      </div>

      <hr style="margin:14px 0;border:none;border-top:1px solid #e2e8f0;">
      <h3 style="margin:0 0 8px 0">Impressora térmica</h3>
      <label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <input id="impHabilitada" type="checkbox"> Habilitar impressão
      </label>
      <div class="form-group">
        <label for="impTipo">Modo de conexão</label>
        <select id="impTipo">
          <option value="local">Local (Windows)</option>
          <option value="rede">Rede (IP/Porta)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="impNome">Nome (apenas identificação)</label>
        <input id="impNome" type="text" placeholder="Ex: Balcão">
      </div>
      <div class="form-group" id="impHostGroup">
        <label>Host e Porta</label>
        <div class="printer-grid">
          <input id="impHost" type="text" placeholder="192.168.0.50">
          <input id="impPorta" type="number" min="1" max="65535" placeholder="9100">
        </div>
      </div>
      <div class="form-group" id="impLocalGroup">
        <label for="impLocal">Impressora local (Windows)</label>
        <input id="impLocal" list="impLocaisList" type="text" placeholder="Nome da impressora local">
        <datalist id="impLocaisList"></datalist>
      </div>
      <div class="cfg-actions">
        <button id="btnSalvarImpressora" class="btn btn-primary">Salvar impressora</button>
        <button id="btnListarImpressoras" class="btn btn-secondary">Listar locais</button>
        <button id="btnTesteImpressora" class="btn btn-secondary">Imprimir teste</button>
      </div>
      <div class="form-group" style="margin-top:10px;">
        <label>O que imprimir automaticamente</label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-top:6px">
          <input id="impAutoFechamento" type="checkbox"> Comprovante de balcão ao fechar comanda
        </label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-top:6px">
          <input id="impAutoCozinhaItem" type="checkbox"> Ticket da cozinha ao adicionar/alterar item de cozinha
        </label>
      </div>
      <small id="impStatus" style="display:block;margin-top:8px;color:#64748b"></small>
    </section>

    <section class="card">
      <h2>Equipe e Permissões</h2>

      <div class="users-topbar">
        <input id="filtroUsuario" type="text" placeholder="Buscar por nome ou login...">
      </div>

      <div class="form-group">
        <label for="novoNome">Nome</label>
        <input id="novoNome" type="text" placeholder="Nome do funcionário">
      </div>
      <div class="form-group">
        <label for="novoLogin">Login</label>
        <input id="novoLogin" type="text" placeholder="login">
      </div>
      <div class="form-group">
        <label for="novoSenha">Senha</label>
        <input id="novoSenha" type="password" placeholder="senha inicial">
      </div>
      <div class="form-group">
        <label for="novoRole">Nível</label>
        <select id="novoRole">
          <option value="funcionario">Funcionário</option>
          <option value="gerente">Gerente</option>
        </select>
      </div>
      <div class="cfg-actions" style="margin-bottom:10px">
        <button id="btnCriarUsuario" class="btn btn-primary">Adicionar usuário</button>
      </div>
      <div id="usersList" class="users-list"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/common.js"></script>
  <script src="js/configuracoes.js"></script>
</body>
</html>
