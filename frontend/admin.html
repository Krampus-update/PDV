<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - Admin</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .admin-wrap { padding: 18px; }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .response {
            background: #f5f5f5;
            border-left: 4px solid #1d4ed8;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .response pre {
            color: #333;
            font-size: 12px;
            line-height: 1.5;
            font-family: 'Courier New', monospace;
        }

        .response.error { border-left-color: #f44336; background: #ffebee; }
        .response.success { border-left-color: #4CAF50; background: #e8f5e9; }

        .grid-full { grid-column: 1 / -1; }

        .products-list { max-height: 400px; overflow-y: auto; }

        .product-item {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 3px solid #1d4ed8;
        }

        .product-item strong { color: #1d4ed8; }
        .product-item span { color: #666; font-size: 12px; }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group button { width: 100%; }

        @media (max-width: 768px) {
            .content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="app-page">
    <header class="app-topbar">
        <div class="topbar-left">
            <div class="topbar-logo">PDV</div>
            <div class="topbar-brand">
                <div class="name" id="topRestaurantName">Restaurante</div>
                <div class="meta" id="topRestaurantMeta">Tenant</div>
            </div>
            <span class="status offline" id="status">Offline</span>
        </div>

        <nav class="topbar-center">
            <span class="topbar-link active">Admin</span>
        </nav>

        <div class="topbar-right">
            <div class="topbar-user-wrap">
                <button id="topUserTrigger" class="topbar-user-trigger" type="button">
                    <div class="topbar-user">
                        <div class="user-avatar" id="topUserAvatar">US</div>
                        <div>
                            <div class="user-name" id="topUserName">Usuário</div>
                            <div class="meta" id="topUserRole"></div>
                        </div>
                    </div>
                </button>
                <div id="topUserMenu" class="user-menu hidden"></div>
            </div>
        </div>
    </header>

    <div class="admin-wrap">
        <div class="card" style="margin-bottom:20px">
            <h2>Painel técnico e testes de API</h2>
            <p style="color:#64748b">Ferramenta legada para operações administrativas e diagnóstico.</p>
        </div>

        <div class="content">
            <div class="card">
                <h2>📦 Produtos</h2>

                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" id="produto_nome" placeholder="Ex: Cerveja 600ml">
                </div>

                <div class="form-group">
                    <label>Preço</label>
                    <input type="number" id="produto_preco" placeholder="Ex: 15.50" step="0.01">
                </div>

                <div class="form-group">
                    <label>Estoque</label>
                    <input type="number" id="produto_estoque" placeholder="Ex: 100" value="0">
                </div>

                <div class="form-group">
                    <label>Estoque Mínimo</label>
                    <input type="number" id="produto_minimo" placeholder="Ex: 10" value="0">
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="criarProduto()">Criar</button>
                    <button class="btn btn-secondary" onclick="listarProdutos()">Listar</button>
                </div>

                <div class="response" id="response_produtos" style="display:none;"></div>
                <div id="produtos_list" class="products-list"></div>
            </div>

            <div class="card">
                <h2>💰 Vendas</h2>

                <div class="form-group">
                    <label>Tipo de Venda</label>
                    <select id="venda_tipo">
                        <option value="bar">Bar</option>
                        <option value="fastfood">Fast Food</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="criarVenda()">Criar Venda</button>
                    <button class="btn btn-secondary" onclick="obterVendasAbertas()">Ver Abertas</button>
                </div>

                <div class="response" id="response_vendas" style="display:none;"></div>
            </div>

            <div class="card">
                <h2>🛒 Adicionar Item</h2>

                <div class="form-group">
                    <label>ID da Venda</label>
                    <input type="number" id="item_venda_id" placeholder="Ex: 1" value="1">
                </div>

                <div class="form-group">
                    <label>ID do Produto</label>
                    <input type="number" id="item_produto_id" placeholder="Ex: 1" value="1">
                </div>

                <div class="form-group">
                    <label>Quantidade</label>
                    <input type="number" id="item_quantidade" placeholder="Ex: 2" value="1">
                </div>

                <button class="btn btn-primary btn-block" onclick="adicionarItem()">Adicionar Item</button>
                <div class="response" id="response_item" style="display:none;"></div>
            </div>

            <div class="card">
                <h2>✅ Fechar Venda</h2>

                <div class="form-group">
                    <label>ID da Venda</label>
                    <input type="number" id="fechar_venda_id" placeholder="Ex: 1" value="1">
                </div>

                <div class="form-group">
                    <label>Forma de Pagamento</label>
                    <select id="forma_pagamento">
                        <option value="dinheiro">Dinheiro</option>
                        <option value="débito">Débito</option>
                        <option value="crédito">Crédito</option>
                        <option value="pix">PIX</option>
                    </select>
                </div>

                <button class="btn btn-success btn-block" onclick="fecharVenda()">Fechar Venda</button>
                <div class="response" id="response_fechar" style="display:none;"></div>
            </div>

            <div class="card">
                <h2>📊 Ver Venda Completa</h2>

                <div class="form-group">
                    <label>ID da Venda</label>
                    <input type="number" id="ver_venda_id" placeholder="Ex: 1" value="1">
                </div>

                <button class="btn btn-secondary btn-block" onclick="obterVenda()">Ver Venda</button>
                <div class="response" id="response_ver_venda" style="display:none;"></div>
            </div>

            <div class="card grid-full">
                <h2>🔧 Status da API</h2>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="verificarStatus()">Verificar Status</button>
                    <button class="btn btn-warning" onclick="limparCache()">Limpar Cache Local</button>
                </div>
                <div class="response" id="response_status" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/common.js"></script>
    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:3000/api`;

        async function apiRequest(endpoint, options = {}) {
            const token = (window.API && API.getToken) ? API.getToken() : localStorage.getItem('pdv_token');
            const tenant = (window.API && API.getTenant) ? API.getTenant() : localStorage.getItem('pdv_tenant');
            const response = await fetch(`${API_URL}${endpoint}`, {
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                    ...(tenant ? { 'x-tenant-code': tenant } : {})
                },
                ...options
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || `Erro ${response.status}`);
            }
            return data;
        }

        window.addEventListener('load', () => {
            verificarStatus();
            setInterval(verificarStatus, 5000);
        });

        function verificarStatus() {
            apiRequest('/status')
                .then(() => {
                    document.getElementById('status').className = 'status online';
                    document.getElementById('status').textContent = '🟢 Online';
                })
                .catch(() => {
                    document.getElementById('status').className = 'status offline';
                    document.getElementById('status').textContent = '🔴 Offline';
                });
        }

        function mostrarResposta(elementId, dados, erro = false) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'response ' + (erro ? 'error' : 'success');
            element.innerHTML = `<pre>${JSON.stringify(dados, null, 2)}</pre>`;
        }

        function criarProduto() {
            const nome = document.getElementById('produto_nome').value;
            const preco = parseFloat(document.getElementById('produto_preco').value);
            const estoque = parseInt(document.getElementById('produto_estoque').value);
            const minimo = parseInt(document.getElementById('produto_minimo').value);

            if (!nome || !preco) {
                alert('Preencha nome e preço');
                return;
            }

            apiRequest('/produtos', {
                method: 'POST',
                body: JSON.stringify({
                    nome, preco, estoque, estoque_minimo: minimo, tipo: 'simples'
                })
            })
            .then(data => {
                mostrarResposta('response_produtos', data);
                document.getElementById('produto_nome').value = '';
                document.getElementById('produto_preco').value = '';
                listarProdutos();
            })
            .catch(e => mostrarResposta('response_produtos', { erro: e.message }, true));
        }

        function listarProdutos() {
            apiRequest('/produtos')
                .then(produtos => {
                    let html = '';
                    produtos.forEach(p => {
                        html += `
                            <div class="product-item">
                                <strong>#${p.id} - ${p.nome}</strong><br>
                                <span>R$ ${p.preco.toFixed(2)} | Estoque: ${p.estoque}</span>
                            </div>
                        `;
                    });
                    document.getElementById('produtos_list').innerHTML = html;
                    mostrarResposta('response_produtos', produtos);
                })
                .catch(e => mostrarResposta('response_produtos', { erro: e.message }, true));
        }

        function criarVenda() {
            const tipo = document.getElementById('venda_tipo').value;

            apiRequest('/vendas', {
                method: 'POST',
                body: JSON.stringify({ tipo })
            })
            .then(data => {
                mostrarResposta('response_vendas', data);
                document.getElementById('item_venda_id').value = data.id;
                document.getElementById('fechar_venda_id').value = data.id;
                document.getElementById('ver_venda_id').value = data.id;
            })
            .catch(e => mostrarResposta('response_vendas', { erro: e.message }, true));
        }

        function obterVendasAbertas() {
            apiRequest('/vendas/abertas')
                .then(data => mostrarResposta('response_vendas', data))
                .catch(e => mostrarResposta('response_vendas', { erro: e.message }, true));
        }

        function obterVenda() {
            const id = document.getElementById('ver_venda_id').value;
            apiRequest('/vendas/' + id)
                .then(data => mostrarResposta('response_ver_venda', data))
                .catch(e => mostrarResposta('response_ver_venda', { erro: e.message }, true));
        }

        function adicionarItem() {
            const venda_id = document.getElementById('item_venda_id').value;
            const produto_id = document.getElementById('item_produto_id').value;
            const quantidade = parseInt(document.getElementById('item_quantidade').value);

            if (!venda_id || !produto_id || !quantidade) {
                alert('Preencha todos os campos');
                return;
            }

            apiRequest(`/vendas/${venda_id}/itens`, {
                method: 'POST',
                body: JSON.stringify({ produto_id, quantidade })
            })
            .then(data => mostrarResposta('response_item', data))
            .catch(e => mostrarResposta('response_item', { erro: e.message }, true));
        }

        function fecharVenda() {
            const id = document.getElementById('fechar_venda_id').value;
            const forma_pagamento = document.getElementById('forma_pagamento').value;

            apiRequest(`/vendas/${id}/fechar`, {
                method: 'PUT',
                body: JSON.stringify({ forma_pagamento })
            })
            .then(data => mostrarResposta('response_fechar', data))
            .catch(e => mostrarResposta('response_fechar', { erro: e.message }, true));
        }

        function limparCache() {
            localStorage.clear();
            alert('Cache limpo!');
        }
    </script>
</body>
</html>
