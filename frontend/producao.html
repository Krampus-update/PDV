<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Produção - PDV</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/producao.css">
</head>
<body class="app-page">
    <header class="app-topbar">
        <div class="topbar-left">
            <div class="topbar-logo">PDV</div>
            <div class="topbar-brand">
                <div class="name" id="topRestaurantName">Restaurante</div>
                <div class="meta" id="topRestaurantMeta">Tenant</div>
            </div>
            <span id="conexao" class="status online">● Online</span>
        </div>

        <nav class="topbar-center">
            <span class="topbar-link active">Cozinha</span>
        </nav>

        <div class="topbar-right">
            <button id="btnRecarregar" class="btn-topbar">Recarregar</button>
            <div class="topbar-user-wrap">
                <button id="topUserTrigger" class="topbar-user-trigger" type="button">
                    <div class="topbar-user">
                        <div class="user-avatar" id="topUserAvatar">US</div>
                        <div>
                            <div class="user-name" id="topUserName">Usuário</div>
                            <div class="meta" id="topUserRole"></div>
                        </div>
                    </div>
                </button>
                <div id="topUserMenu" class="user-menu hidden"></div>
            </div>
        </div>
    </header>

    <div class="container" style="height:calc(100vh - 72px)">
        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-numero" id="totalEmPreparo">0</span>
                <span class="stat-label">Em Preparo</span>
            </div>
            <div class="stat-card">
                <span class="stat-numero" id="totalProntos">0</span>
                <span class="stat-label">Prontos para Entrega</span>
            </div>
        </div>

        <div class="main-content">
            <div class="abas-filtro">
                <button class="aba aba-ativa" data-status="em_preparo">
                    🍳 Em Preparo
                </button>
                <button class="aba" data-status="pronta">
                    ✅ Prontos para Entrega
                </button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 170px;gap:10px;margin:0 0 12px">
                <input type="text" id="buscaPedido" class="search-input" placeholder="Buscar por mesa, item ou comanda" style="margin:0">
                <select id="filtroTipoPedido" class="filter-select">
                    <option value="todos">Todos</option>
                    <option value="mesa">Somente mesa</option>
                    <option value="balcao">Somente balcão</option>
                </select>
            </div>

            <div id="gridPedidos" class="grid-pedidos">
                <p class="placeholder">Nenhum pedido em preparo</p>
            </div>
        </div>
    </div>

    <div id="modalDetalhes" class="modal" style="display: none;">
        <div class="modal-content modal-pedido">
            <div class="modal-header">
                <h2 id="tituloPedido">Pedido #--</h2>
                <button class="btn-fechar" id="btnFecharModal">&times;</button>
            </div>

            <div class="info-pedido">
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span id="statusPedido" class="status-badge em_preparo">em_preparo</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Horário do Pedido:</span>
                    <span id="horarioPedido">--:--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Tempo em Preparo:</span>
                    <span id="tempoEspera">0 min</span>
                </div>
            </div>

            <div class="itens-pedido">
                <h3>Itens para Preparar</h3>
                <div id="itensPedido" class="lista-itens"></div>
            </div>

            <div class="observacoes">
                <h4>Observações:</h4>
                <p id="observacoesPedido" class="obs-texto">--</p>
            </div>

            <div class="modal-acoes">
                <button id="btnMarcarPronto" class="btn btn-success btn-grande">✅ Marcar como Pronto</button>
                <button id="btnCancelarDetalhes" class="btn btn-secondary">Voltar</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/common.js"></script>
    <script src="js/config-modal.js"></script>
    <script src="js/producao.js"></script>
</body>
</html>
