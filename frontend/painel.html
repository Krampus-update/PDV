<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDV - Painel</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .hidden { display: none !important; }

    .app-content {
      height: calc(100vh - 72px);
      overflow: hidden;
    }

    .products-main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .products-main.grouped {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .category-section {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      background: #ffffff;
    }
    .category-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }
    .category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
      position: sticky;
      top: 0;
      z-index: 5;
      background: #fff;
      padding: 8px 0;
      border-bottom: 1px solid #eef2f7;
    }
    .category-chip {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #334155;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .category-chip.active {
      border-color: var(--primary);
      background: #e8f2ff;
      color: #1e3a8a;
    }

    .product-list { display: flex; flex-direction: column; gap: 4px; }

    .product-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }

    .product-list-item:hover { border-color: var(--primary); }
    .product-list-item.selected { background: #e8f2ff; border-color: var(--primary); }

    .product-list-item-name { flex: 1; font-weight: 600; font-size: 13px; }

    .product-list-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }

    .product-list-item-info .qty { color: #64748b; }
    .product-list-item-info .price { color: var(--success); font-weight: bold; min-width: 50px; }

    .product-list-item-info .delete-btn {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
    }

    .mesas-list { display: flex; flex-direction: column; gap: 8px; }

    .mesas-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mesas-list-item:hover { border-color: var(--primary); }
    .mesas-list-item strong { font-size: 14px; }
    .mesas-list-item .mesa-value { color: var(--success); font-weight: bold; font-size: 13px; }

    .produtos-mesa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .produto-mesa-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 11px;
    }

    .produto-mesa-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }

    .produto-mesa-card-img {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 10px;
      margin-bottom: 4px;
    }

    .produto-mesa-card-name { font-weight: 600; line-height: 1.1; margin-bottom: 2px; }
    .produto-mesa-card-price { color: var(--success); font-weight: bold; }

    .mesa-items-list {
      background: #f8fafc;
      border-radius: 6px;
      padding: 8px;
      max-height: 110px;
      overflow-y: auto;
      margin: 8px 0;
      font-size: 12px;
    }

    .mesa-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 11px;
    }

    .mesa-item:last-child { border-bottom: none; }
  </style>
</head>
<body class="app-page">
  <header class="app-topbar">
    <div class="topbar-left">
      <div class="topbar-logo">PDV</div>
      <div class="topbar-brand">
        <div class="name" id="topRestaurantName">Restaurante</div>
        <div class="meta" id="topRestaurantMeta">Tenant</div>
      </div>
      <span id="conexao" class="status online">● Online</span>
    </div>

    <nav class="topbar-center">
      <button class="topbar-tab tab active" data-target="home">Principal</button>
      <button class="topbar-tab tab" data-target="produtos">Estoque</button>
      <button class="topbar-tab tab" data-target="mesas">Comandas</button>
      <button class="topbar-tab tab" data-target="clientes">Clientes</button>
    </nav>

    <div class="topbar-right">
      <div class="topbar-user-wrap">
        <button id="topUserTrigger" class="topbar-user-trigger" type="button">
          <div class="topbar-user">
            <div class="user-avatar" id="topUserAvatar">US</div>
            <div>
              <div class="user-name" id="topUserName">Usuário</div>
              <div class="meta" id="topUserRole"></div>
            </div>
          </div>
        </button>
        <div id="topUserMenu" class="user-menu hidden"></div>
      </div>
    </div>
  </header>

  <div class="app-content">
    <!-- ABA PRINCIPAL -->
    <section id="home" class="tab-content">
      <div class="two-column-layout">
        <div class="main-content">
          <h2>Catálogo de Produtos</h2>
          <div class="main-content-scroll">
            <div id="homeCategorias" class="category-chips"></div>
            <div id="produtosGrid" class="products-main"></div>
          </div>
        </div>

        <div class="sidebar" id="sidePrincipal">
          <div class="sidebar-section">
            <h3>Comanda</h3>
            <div style="margin-bottom:8px;">
              <label style="font-size:12px;color:#666">Mesa:</label>
              <input type="text" id="mesa" placeholder="Ex: 1, A, VIP" style="font-size:12px;padding:8px;width:100%" />
            </div>
            <div class="cart-section" id="carrinhoItens">
              <p style="color:#666;margin:0;font-size:12px">Clique em um produto</p>
            </div>
            <div style="font-size:12px;margin-bottom:8px">
              Total: <span id="carrinhoTotal" style="color:var(--success);font-weight:bold">R$ 0,00</span>
            </div>
            <button id="btnFinalizarVenda" class="btn btn-primary btn-block" style="font-size:12px;padding:10px">Abrir Comanda</button>
          </div>

          <hr style="margin:12px 0;border:none;border-top:1px solid #eee" />

          <div class="sidebar-section">
            <h3>Valores Avulsos</h3>
            <div id="displayValor" class="display-value">R$ 0,00</div>
            <div id="teclado" class="numeric-pad"></div>
            <div style="display:flex;gap:8px">
              <button id="btnClear" class="pad-key secondary" style="flex:1;padding:10px;font-size:12px">Limpar</button>
              <button id="btnAddValor" class="pad-key" style="flex:1;padding:10px;font-size:12px">Adicionar</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ABA ESTOQUE -->
    <section id="produtos" class="tab-content hidden">
      <div class="two-column-layout">
        <div class="main-content">
          <h2>Estoque e Cardápio</h2>
          <div class="main-content-scroll">
            <div id="prodList" class="product-list"></div>
          </div>
        </div>

        <div class="sidebar" id="sideProdutos">
          <div class="sidebar-section">
            <h3>Novo Produto</h3>
            <input type="text" id="novoProdutoNome" placeholder="Nome" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <label style="font-size:12px;margin-bottom:4px;display:block;color:#666">Preço</label>
            <div id="displayPreco" class="display-value" style="font-size:16px;margin-bottom:8px">R$ 0,00</div>
            <div id="precoTeclado" class="numeric-pad" style="grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px"></div>
            <input type="number" id="novoProdutoEstoque" placeholder="Estoque" value="0" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <label style="font-size:12px;margin-bottom:4px;display:block;color:#666">Categoria</label>
            <input list="categoriasList" type="text" id="novoProdutoCategoria" placeholder="Ex: bebidas, comidas, sobremesas" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <datalist id="categoriasList"></datalist>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#666;margin-bottom:8px">
              <input type="checkbox" id="novoProdutoDestaque" style="width:auto">
              Destacar no cardápio (promoção)
            </label>
            <label style="font-size:12px;margin-bottom:4px;display:block;color:#666">Popularidade (ordem)</label>
            <input type="number" id="novoProdutoPopularidade" placeholder="0" value="0" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <label style="font-size:12px;margin-bottom:4px;display:block;color:#666">Variações de tamanho</label>
            <div id="variacoesList" class="variacao-list"></div>
            <button id="btnAddVariacao" type="button" class="btn btn-secondary btn-block" style="font-size:12px;padding:8px;margin-bottom:8px">+ Adicionar variação</button>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#666;margin-bottom:8px">
              <input type="checkbox" id="novoProdutoVaiCozinha" style="width:auto">
              Enviar para cozinha (produção)
            </label>
            <label style="font-size:12px;margin-bottom:4px;display:block;color:#666">Imagem (opcional)</label>
            <input type="file" id="novoProdutoImagem" accept="image/*" style="font-size:11px;margin-bottom:6px;width:100%" />
            <img id="previewImagem" style="max-width:100%;max-height:80px;display:none;margin-bottom:6px;border-radius:4px" />
            <button id="btnCriarProduto" class="btn btn-primary btn-block" style="font-size:12px;padding:10px">Criar Produto</button>
            <button id="btnCancelarEdicao" class="btn secondary btn-block" style="font-size:12px;padding:10px;display:none;margin-top:8px">Cancelar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ABA COMANDAS -->
    <section id="mesas" class="tab-content hidden">
      <div class="two-column-layout">
        <div class="main-content">
          <h2>Comandas Abertas</h2>
          <div class="main-content-scroll">
            <div style="display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:10px">
              <input type="text" id="buscaComanda" placeholder="Buscar por mesa, balcão ou ID" style="font-size:12px;padding:8px">
              <select id="filtroStatusComanda" style="font-size:12px;padding:8px">
                <option value="todas">Todos status</option>
                <option value="aberta">Aberta</option>
                <option value="em_preparo">Em preparo</option>
                <option value="pronta">Pronta</option>
              </select>
            </div>
            <div id="listaMesas" class="mesas-list"></div>
          </div>
        </div>

        <div class="sidebar" id="sideMesas">
          <p style="color:#999;font-size:12px">Selecione uma comanda à esquerda</p>
        </div>
      </div>
    </section>

    <section id="clientes" class="tab-content hidden">
      <div class="two-column-layout">
        <div class="main-content">
          <h2>Clientes</h2>
          <div class="main-content-scroll">
            <input type="text" id="buscaCliente" placeholder="Buscar por nome/telefone" style="margin-bottom:10px;">
            <div id="listaClientes" class="product-list"></div>
          </div>
        </div>
        <div class="sidebar" id="sideClientes">
          <div class="sidebar-section">
            <h3 id="tituloClienteForm">Novo Cliente</h3>
            <input type="text" id="clienteNome" placeholder="Nome" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <input type="text" id="clienteTelefone" placeholder="Telefone" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <input type="number" id="clientePontos" placeholder="Pontos" value="0" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <textarea id="clienteObs" placeholder="Observações" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%;min-height:80px"></textarea>
            <button id="btnSalvarCliente" class="btn btn-primary btn-block" style="font-size:12px;padding:10px">Salvar Cliente</button>
            <button id="btnCancelarCliente" class="btn secondary btn-block" style="font-size:12px;padding:10px;display:none;margin-top:8px">Cancelar</button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/common.js"></script>
  <script src="js/config-modal.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
