<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDV - Painel</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    :root{--accent:#0047ab}
    body{background:#f5f5f5;margin:0;height:100%}
    .container{padding:16px;height:calc(100% - 68px)}
    
    /* Tabs */
    .tabs{display:flex;gap:8px;padding:12px;background:#fff;border-bottom:1px solid #eee}
    .tab{padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:#666;transition:all 0.2s}
    .tab:hover{background:#f5f5f5}
    .tab.active{background:var(--primary);color:#fff}
    
    .hidden{display:none!important}
    .tab-content{height:100%;overflow:hidden}
    
    .products-main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .product-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 6px;
      border: 1px solid #f0f0f0;
      transition: all 0.2s;
    }
    
    .product-list-item:hover {
      background: #f0f0f0;
      border-color: var(--primary);
    }
    
    .product-list-item-name {
      flex: 1;
      font-weight: 600;
      font-size: 13px;
    }
    
    .product-list-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }
    
    .product-list-item-info .qty {
      color: #999;
    }
    
    .product-list-item-info .price {
      color: var(--success);
      font-weight: bold;
      min-width: 50px;
    }
    
    .product-list-item-info .delete-btn {
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 11px;
    }

    /* highlight selecionado na lista */
    .product-list-item.selected {
      background: #e8f4ff;
      border-color: var(--primary);
    }
    
    .mesas-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .mesas-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 6px;
      border: 1px solid #f0f0f0;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .mesas-list-item:hover {
      background: #f0f0f0;
      border-color: var(--primary);
    }
    
    .mesas-list-item strong {
      font-size: 14px;
      color: var(--dark-gray);
    }
    
    .mesas-list-item .mesa-value {
      color: var(--success);
      font-weight: bold;
      font-size: 13px;
    }
    
    .produtos-mesa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    
    .produto-mesa-card {
      background: white;
      border: 1px solid #f0f0f0;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 11px;
    }
    
    .produto-mesa-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow);
    }
    
    .produto-mesa-card-img {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #f0f0f0, #e8e8e8);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 10px;
      margin-bottom: 4px;
    }
    
    .produto-mesa-card-name {
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 2px;
    }
    
    .produto-mesa-card-price {
      color: var(--success);
      font-weight: bold;
    }
    
    .mesa-items-list {
      background: #f9f9f9;
      border-radius: 4px;
      padding: 8px;
      max-height: 80px;
      overflow-y: auto;
      margin: 8px 0;
      font-size: 12px;
    }
    
    .mesa-items-list::-webkit-scrollbar {
      width: 4px;
    }
    
    .mesa-items-list::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 2px;
    }
    
    .mesa-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid #eee;
      font-size: 11px;
    }
    
    .mesa-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-target="home">🏠 Principal</div>
    <div class="tab" data-target="produtos">🛍️ Produtos</div>
    <div class="tab" data-target="mesas">🍽️ Comandas</div>
    <div class="tab" data-target="config">⚙️ Configurações</div>
  </div>

  <div class="container">
    <!-- ABA PRINCIPAL -->
    <section id="home" class="tab-content">
      <div class="two-column-layout">
        <div class="main-content">
          <h2>Catálogo de Produtos</h2>
          <div class="main-content-scroll">
            <div id="produtosGrid" class="products-main"></div>
          </div>
        </div>

        <div class="sidebar" id="sidePrincipal">
          <div class="sidebar-section">
            <h3>Comanda</h3>
            <div style="margin-bottom:8px;">
              <label style="font-size:12px;color:#666">Mesa:</label>
              <input type="text" id="mesa" placeholder="Ex: 1, A, VIP" style="font-size:12px;padding:8px;width:100%" />
            </div>
            <div class="cart-section" id="carrinhoItens">
              <p style="color:#666;margin:0;font-size:12px">Clique em um produto</p>
            </div>
            <div style="font-size:12px;margin-bottom:8px">
              Total: <span id="carrinhoTotal" style="color:var(--success);font-weight:bold">R$ 0,00</span>
            </div>
            <button id="btnFinalizarVenda" class="btn btn-primary btn-block" style="font-size:12px;padding:10px">Abrir Comanda</button>
          </div>
          
          <hr style="margin:12px 0;border:none;border-top:1px solid #eee" />
          
          <div class="sidebar-section">
            <h3>Valores Avulsos</h3>
            <div id="displayValor" class="display-value">R$ 0,00</div>
            <div id="teclado" class="numeric-pad"></div>
            <div style="display:flex;gap:8px">
              <button id="btnClear" class="pad-key secondary" style="flex:1;padding:10px;font-size:12px">Limpar</button>
              <button id="btnAddValor" class="pad-key" style="flex:1;padding:10px;font-size:12px">Adicionar</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ABA PRODUTOS -->
    <section id="produtos" class="tab-content hidden">
      <div class="two-column-layout">
        <div class="main-content">
          <h2>Cadastro de Cardápio</h2>
          <div class="main-content-scroll">
            <div id="prodList" class="product-list"></div>
          </div>
        </div>

        <div class="sidebar" id="sideProdutos">
          <div class="sidebar-section">
            <h3>Novo Produto</h3>
            <input type="text" id="novoProdutoNome" placeholder="Nome" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <label style="font-size:12px;margin-bottom:4px;display:block;color:#666">Preço</label>
            <div id="displayPreco" class="display-value" style="font-size:16px;margin-bottom:8px">R$ 0,00</div>
            <div id="precoTeclado" class="numeric-pad" style="grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px"></div>
            <input type="number" id="novoProdutoEstoque" placeholder="Estoque" value="0" style="font-size:12px;padding:8px;margin-bottom:8px;width:100%" />
            <label style="font-size:12px;margin-bottom:4px;display:block;color:#666">Imagem (opcional)</label>
            <input type="file" id="novoProdutoImagem" accept="image/*" style="font-size:11px;margin-bottom:6px;width:100%" />
            <img id="previewImagem" style="max-width:100%;max-height:80px;display:none;margin-bottom:6px;border-radius:4px" />
            <button id="btnCriarProduto" class="btn btn-primary btn-block" style="font-size:12px;padding:10px">Criar Produto</button>
            <button id="btnCancelarEdicao" class="btn secondary btn-block" style="font-size:12px;padding:10px;display:none;margin-top:8px">Cancelar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ABA COMANDAS -->
    <section id="mesas" class="tab-content hidden">
      <div class="two-column-layout">
        <div class="main-content">
          <h2>Comandas Abertas</h2>
          <div class="main-content-scroll">
            <div id="listaMesas" class="mesas-list"></div>
          </div>
        </div>

        <div class="sidebar" id="sideMesas">
          <p style="color:#999;font-size:12px">Selecione uma comanda à esquerda</p>
        </div>
      </div>
    </section>

    <!-- ABA CONFIGURAÇÕES -->
    <section id="config" class="tab-content hidden">
      <div class="two-column-layout" style="grid-template-columns:1fr">
        <div class="main-content">
          <h2>Configurações</h2>
          <div style="padding:12px;overflow-y:auto">
            <form class="item-form" id="configForm" style="max-width:400px">
              <div style="margin-bottom:12px">
                <label style="display:block;margin-bottom:6px;font-weight:600;font-size:12px">Nome do estabelecimento</label>
                <input type="text" id="nomeEstabelecimento" style="font-size:12px;padding:8px;width:100%" />
              </div>
              <div style="margin-bottom:12px">
                <label style="display:block;margin-bottom:6px;font-weight:600;font-size:12px">Modo de operação</label>
                <select id="modoOperacao" style="font-size:12px;padding:8px;width:100%">
                  <option value="bar">Bar</option>
                  <option value="fastfood">Fast Food</option>
                  <option value="hibrido">Híbrido</option>
                </select>
              </div>
              <div style="margin-bottom:12px">
                <label style="display:block;margin-bottom:6px;font-weight:600;font-size:12px">Cor de destaque</label>
                <input type="color" id="corDestaque" value="#0047ab" />
              </div>
              <button type="button" id="salvarConfig" class="btn btn-primary btn-block" style="font-size:12px;padding:10px">Salvar</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
