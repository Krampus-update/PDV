<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garçom - PDV</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/garcom.css">
</head>
<body class="app-page garcom-page">
    <header class="app-topbar">
        <div class="topbar-left">
            <div class="topbar-logo">PDV</div>
            <div class="topbar-brand">
                <div class="name" id="topRestaurantName">Restaurante</div>
                <div class="meta" id="topRestaurantMeta">Tenant</div>
            </div>
            <span id="conexao" class="status online">● Online</span>
        </div>

        <nav class="topbar-center">
            <div class="mobile-status-current" aria-label="Status atual">
                <span class="status-current-dot" id="statusCurrentDot"></span>
                <span id="statusCurrentLabel">Todas</span>
                <span class="status-stepper" aria-hidden="true">
                    <span class="status-step active" data-step="todas"></span>
                    <span class="status-step" data-step="em_preparo"></span>
                    <span class="status-step" data-step="pronta"></span>
                </span>
            </div>
        </nav>

        <div class="topbar-right">
            <div class="topbar-user-wrap">
                <button id="topUserTrigger" class="topbar-user-trigger" type="button">
                    <div class="topbar-user">
                        <div class="user-avatar" id="topUserAvatar">US</div>
                        <div class="topbar-user-meta">
                            <div class="user-name" id="topUserName">Usuário</div>
                            <div class="meta" id="topUserRole"></div>
                        </div>
                    </div>
                </button>
                <div id="topUserMenu" class="user-menu hidden"></div>
            </div>
        </div>
    </header>

    <div class="container" style="height:calc(100vh - 72px)">
        <button id="btnNovaComanda" class="btn-floating">+</button>

        <div class="main-content">
            <div class="abas-filtro">
                <button class="aba aba-ativa" data-status="todas">
                    Todas <span class="badge" id="badgeAbertas">0</span>
                </button>
                <button class="aba" data-status="em_preparo">
                    Preparando <span class="badge" id="badgePreparo">0</span>
                </button>
                <button class="aba" data-status="pronta">
                    Pronta <span class="badge" id="badgePronta">0</span>
                </button>
            </div>

            <div id="listaVendas" class="lista-vendas">
                <p class="placeholder">Carregando comandas...</p>
            </div>
        </div>
    </div>

    <div id="modalDetalhes" class="modal" style="display: none;">
        <div class="modal-content modal-comanda">
            <div class="modal-header">
                <h2 id="tituloComanda">Comanda #--</h2>
                <button class="btn-fechar" id="btnFecharModal">&times;</button>
            </div>

            <div class="info-comanda">
                <p><strong>Status:</strong> <span id="statusComanda" class="status-badge"></span></p>
                <p><strong>Total:</strong> <span id="totalComanda" class="valor">R$ 0,00</span></p>
            </div>

            <div class="produtos-comanda">
                <h3>Itens da Comanda</h3>
                <div id="itensComanda" class="itens grid-items">
                </div>
            </div>

            <div class="produtos-section">
                <div style="display:flex;gap:8px;margin-bottom:10px">
                    <button id="btnModoProdutos" class="btn" style="flex:1;padding:10px;font-size:12px">Produtos</button>
                    <button id="btnModoAvulso" class="btn btn-secondary" style="flex:1;padding:10px;font-size:12px">Valor Avulso</button>
                </div>

                <div id="blocoProdutosModal">
                    <h3>Adicionar Itens</h3>
                    <input type="text" id="buscaProdutoModal" class="search-input" placeholder="🔍 Buscar...">
                    <div id="chipsCategoriaModal" class="chips-categoria-modal"></div>
                    <div id="gridProdutosModal" class="grid-produtos-modal">
                        <p class="placeholder">Carregando produtos...</p>
                    </div>
                </div>

                <div id="blocoAvulsoModal" style="display:none">
                    <h3>Adicionar Valor Avulso</h3>
                    <div id="displayAvulsoModal" class="display-value" style="font-size:22px;margin-bottom:10px">R$ 0,00</div>
                    <div id="tecladoAvulsoModal" class="numeric-pad"></div>
                    <div style="display:flex;gap:8px;margin-top:10px">
                        <button id="btnClearAvulsoModal" class="pad-key secondary" style="flex:1;padding:10px;font-size:12px">Limpar</button>
                        <button id="btnAddAvulsoModal" class="pad-key" style="flex:1;padding:10px;font-size:12px">Adicionar</button>
                    </div>
                </div>
            </div>

            <div class="modal-acoes">
                <button id="btnRemoverUltimo" class="btn btn-warning">← Remover Último</button>
                <button id="btnFecharComanda" class="btn btn-success">Finalizar</button>
                <button id="btnCancelarComanda" class="btn btn-secondary">Voltar</button>
            </div>
        </div>
    </div>

    <div id="modalAjustarQtd" class="modal" style="display: none;">
        <div class="modal-content modal-ajustar" style="position:fixed;bottom:0;left:0;right:0;width:100%;max-width:100%;border-radius:12px 12px 0 0;max-height:60vh;display:flex;flex-direction:column;justify-content:space-between">
            <div style="padding:20px;text-align:center;border-bottom:1px solid #eee">
                <p id="produtoNomeQtd" style="font-size:16px;font-weight:bold;margin-bottom:8px"></p>
                <p id="produtoInfoQtd" style="font-size:13px;color:#666;margin:0"></p>
            </div>

            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;gap:20px">
                <button id="btnQtdMais" style="width:100%;padding:20px;font-size:24px;font-weight:bold;background:var(--success);color:white;border:none;border-radius:8px;cursor:pointer">+</button>
                <div id="qtdDisplay" style="font-size:48px;font-weight:bold;color:var(--primary);min-width:80px;text-align:center">0</div>
                <button id="btnQtdMenos" style="width:100%;padding:20px;font-size:24px;font-weight:bold;background:var(--warning);color:white;border:none;border-radius:8px;cursor:pointer">−</button>
            </div>

            <div style="padding:20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-top:1px solid #eee">
                <button id="btnCancelarQtd" style="padding:15px;background:#ddd;border:none;border-radius:6px;cursor:pointer;font-weight:bold">Cancelar</button>
                <button id="btnSalvarQtd" style="padding:15px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold">Salvar</button>
                <button id="btnRemoverItemQtd" style="padding:15px;background:var(--danger);color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold">Remover</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/common.js"></script>
    <script src="js/config-modal.js"></script>
    <script src="js/garcom.js"></script>
</body>
</html>
